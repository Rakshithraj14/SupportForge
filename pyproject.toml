[project]
name = "supportforge"
version = "0.1.0"
description = "SupportForge — RAG-powered support bot (Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "python-telegram-bot>=21.0",
    "langgraph>=1.0",
    "qdrant-client>=1.10",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "deepeval>=4.1",
    "ollama>=0.4",
    "ragas>=0.4,<0.5",
    "openai>=1.0",
    # ragas 0.4.x has no upper bound on these, but breaks on the langchain 1.x line
    "langchain<1.0",
    "langchain-core<1.0",
    "langchain-community<0.4",
    "langchain-openai<0.4",
    "celery[redis]>=5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
